name: Release

on:
  push:
    tags: ["hidra-v*"]

permissions:
  contents: write

jobs:
  release:
    # Hidra is a WPF app; it only builds and runs on Windows.
    runs-on: windows-latest

    steps:
      # fetch-depth: 0 is required for --notes-from-tag below: actions/checkout's default shallow,
      # single-commit checkout doesn't bring over full annotated-tag data, so gh release create
      # silently falls back to the tagged commit's message instead of the tag's own message.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Hidra.sln

      # Neither Hidra.Plugins nor Core_RawInputHook is referenced by Hidra.csproj - both are
      # MEF-loaded at runtime from folders next to the exe (Plugins/ and Providers/
      # respectively, see AGENTS.md and IOController.cs), so publishing the app alone builds
      # neither. Each has its own post-build target that copies its output into Hidra's plain
      # build output (bin/Release/net8.0-windows/{Plugins,Providers}/<Name>/), which the
      # publish step below then picks up separately from the single-file exe. Without
      # Core_RawInputHook specifically, Hidra has no input/output provider at all - no
      # keyboard/mouse devices show up anywhere in the UI.
      - name: Build plugins and providers
        run: >
          dotnet build Hidra.Plugins/Hidra.Plugins.csproj --configuration Release --no-restore &&
          dotnet build "Hidra.IOWrapper/Source/Core Providers/Core_RawInputHook/Core_RawInputHook.csproj" --configuration Release --no-restore

      # Deliberately no --no-restore here: the plain `dotnet restore Hidra.sln` above doesn't
      # pull in win-x64-specific assets, so this step needs its own implicit restore (triggered
      # by --runtime) to have anything to publish against.
      - name: Publish app
        run: >
          dotnet publish Hidra/Hidra.csproj --configuration Release
          --runtime win-x64 --self-contained
          -p:PublishSingleFile=true

      - name: Assemble release folder
        shell: pwsh
        run: |
          $publishDir = "Hidra/bin/Release/net8.0-windows/win-x64/publish"
          Copy-Item -Recurse "Hidra/bin/Release/net8.0-windows/Plugins" "$publishDir/Plugins"
          Copy-Item -Recurse "Hidra/bin/Release/net8.0-windows/Providers" "$publishDir/Providers"
          # Tag is "hidra-v0.1.0" (disambiguated from UCR's own pre-fork v0.1.0-v0.9.0 tags);
          # strip the "hidra-" prefix for a plain "Hidra-v0.1.0-win-x64.zip" asset name.
          $version = "${{ github.ref_name }}" -replace '^hidra-', ''
          Compress-Archive -Path "$publishDir/*" -DestinationPath "Hidra-$version-win-x64.zip"
          echo "ZIP_NAME=Hidra-$version-win-x64.zip" >> $env:GITHUB_ENV
          echo "DISPLAY_VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" "${{ env.ZIP_NAME }}"
          --title "Hidra ${{ env.DISPLAY_VERSION }}"
          --notes-from-tag
